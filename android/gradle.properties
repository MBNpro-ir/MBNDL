org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Some current Flutter plugins still apply KGP, so use AGP 9's official
# compatibility mode until those packages migrate to built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
# Kotlin's incremental cache cannot relativize Pub Cache sources on C: against
# this workspace on H:. Disabling it keeps Windows builds deterministic.
kotlin.incremental=false
