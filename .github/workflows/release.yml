name: 🚀 Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: 🪟 Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Compile Windows x64
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "MBNDL-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBNDL-Windows-x64
          path: MBNDL-Windows-x64.zip
          if-no-files-found: error

  android-arm:
    name: 📱 Android ARM32 + ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Compile Android ARM APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64

      - name: Name release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk MBNDL-Android-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MBNDL-Android-arm64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MBNDL-Android-ARM
          path: |
            MBNDL-Android-arm32.apk
            MBNDL-Android-arm64.apk
          if-no-files-found: error

  release:
    name: 🏷️ GitHub Release
    needs: [windows-x64, android-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
