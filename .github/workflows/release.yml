name: 🚀 Build and publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repair_cache:
        description: Delete and rebuild the shared Flutter/pub caches
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: 🪟 Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flutter with resilient cache
        uses: ./.github/actions/setup-flutter-cache
        with:
          flutter-version: "3.44.6"
          precache-platform: windows
          force-repair: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_cache || false }}

      - name: Compile Windows x64
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "MBNDL-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBNDL-Windows-x64
          path: MBNDL-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  android-arm:
    name: 📱 Android ARM32 + ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter with resilient cache
        uses: ./.github/actions/setup-flutter-cache
        with:
          flutter-version: "3.44.6"
          precache-platform: android
          force-repair: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_cache || false }}

      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release-signing secrets are incomplete." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mbndl-release.jks"
          echo "MBNDL_KEYSTORE_PATH=$RUNNER_TEMP/mbndl-release.jks" >> "$GITHUB_ENV"
          echo "MBNDL_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MBNDL_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MBNDL_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compile Android ARM APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64

      - name: Name release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk MBNDL-Android-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MBNDL-Android-arm64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MBNDL-Android-ARM
          path: |
            MBNDL-Android-arm32.apk
            MBNDL-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: 🏷️ GitHub Release
    needs: [windows-x64, android-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download compiled artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
